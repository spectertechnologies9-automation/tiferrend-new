name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # SITE_BASE pins the 404 page's <base> to the Pages path ("/repo/" or "/" on a custom domain).
      # Every other page uses relative URLs and works at any path.
      - run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - name: Check build output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/work/my-mithila/index.html
          test -f dist/media/video/cosmos-720.mp4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
